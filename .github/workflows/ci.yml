name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm sale del campo `packageManager` de package.json
      # (pnpm/action-setup la lee sola); la de Node, de .nvmrc. Así CI, los
      # Dockerfile y el desarrollo local usan las mismas versiones.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `@licona/webhook-utils` apunta a ./dist: hay que compilarlo antes de
      # que las Apps puedan resolverlo (typecheck y tests incluidos).
      - run: pnpm -r build

      # B-1273: eslint (no-floating-promises, etc.) existía en el package.json pero nadie lo
      # corría. Los errores rompen CI; los warnings (deuda en tests) no.
      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # B-382: valida las subscriptions del manifiesto contra el esquema del fork.
      # Se omite mientras SALEOR_SCHEMA_PATH no exista (el esquema vive en el repo
      # del fork); ver scripts/validar-subscriptions.mjs.
      - run: pnpm check:subscriptions

      # B-1858: detecta Dockerfiles que olvidan el manifiesto de alguna App del
      # workspace (drift que de otro modo solo aparece al construir en Railway).
      # No necesita build previo: solo lee pnpm-workspace.yaml y los Dockerfiles.
      - run: pnpm check:dockerfiles
